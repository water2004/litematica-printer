plugins {
    id 'mod-plugin'
    id 'net.fabricmc.fabric-loom-remap'
}

evaluationDependsOn(':core')

version = modConfig.fullProjectVersion
group = modConfig.modMavenGroup
base {
    archivesName.set(modConfig.modArchivesBaseName)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    implementation project(':core')
    minecraft "com.mojang:minecraft:${modConfig.mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${modConfig.fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${modConfig.fabricApiVersion}"
    modImplementation "maven.modrinth:malilib:${modConfig.malilib}"
    modImplementation "maven.modrinth:litematica:${modConfig.litematica}"
    modCompileOnly("com.terraformersmc:modmenu:${modConfig.prop('modmenu')}") { transitive = false }
    def pinyinDependency = implementation("com.belerweb:pinyin4j:${modConfig.prop('pinyin_version')}")
    include pinyinDependency
}

tasks.named('jar', Jar) {
    dependsOn project(':core').tasks.named('classes')
    from(project(':core').sourceSets.main.output)
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'litematica-printer.refmap.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Separate executable integration harness; never included in the release JAR.
sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
tasks.register('smokeJar', Jar) {
    archiveClassifier = 'smoke-test-dev'
    from sourceSets.smokeTest.output
}
tasks.register('remapSmokeJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('smokeJar')
    inputFile = tasks.named('smokeJar').flatMap { it.archiveFile }
    archiveClassifier = 'smoke-test'
    addNestedDependencies = false
    classpath.from(sourceSets.smokeTest.compileClasspath)
}

// Audit drivers are optional and excluded from normal release builds.
if (providers.gradleProperty('enableAudit').isPresent()
        || gradle.startParameter.taskNames.any { it.toLowerCase().contains('audit') }) {
// Backported upstream audit cases, packaged separately from the release artifact.
dependencies {
    modCompileOnly files(providers.gradleProperty('networkChaosJar').getOrElse(rootProject.file('../NetworkChaosFabric/1.21.11/build/libs/network-chaos-fabric-1.0.0-alpha.3-audit+1.21.11.jar').absolutePath))
}
sourceSets {
    auditTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
tasks.register('auditJar', Jar) {
    archiveClassifier = 'audit-test-dev'
    from sourceSets.auditTest.output
    from(layout.buildDirectory.dir('classes/java/auditTest')) { include '**/*refmap.json' }
}
tasks.register('remapAuditJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('auditJar')
    inputFile = tasks.named('auditJar').flatMap { it.archiveFile }
    archiveClassifier = 'audit-test'
    addNestedDependencies = false
    classpath.from(sourceSets.auditTest.compileClasspath)
}

tasks.register('auditServerJar', Jar) {
    archiveClassifier = 'audit-server-dev'
    from(sourceSets.auditTest.output.classesDirs) { include '**/PrinterAuditServer*.class', '**/AuditServuxServerMixin.class', '**/AuditServuxCounters.class', '**/AuditPacketTrace.class', '**/AuditNetworkSendMixin.class', '**/AuditServerPacketMixin.class', '**/AuditFaultProfile.class' }
    from(layout.buildDirectory.dir('classes/java/auditTest')) { include '**/*refmap.json' }
    from 'src/auditServerResources'
    dependsOn tasks.named('auditTestClasses')
}
tasks.register('remapAuditServerJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('auditServerJar')
    inputFile = tasks.named('auditServerJar').flatMap { it.archiveFile }
    archiveClassifier = 'audit-server'
    addNestedDependencies = false
    classpath.from(sourceSets.auditTest.compileClasspath)
}

}
