plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group


loom {
	accessWidenerPath = file("src/main/resources/quickshulker.accesswidener")
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "quickshulker-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
		clearRunDirectory = true
	}
}

repositories {
 mavenCentral()
 maven { url 'https://maven.fabricmc.net'; content { includeGroupByRegex 'net.fabricmc.*' } }
 maven { url 'https://maven.fallenbreath.me/releases'; content { includeGroup 'me.fallenbreath' } }
 maven { url 'https://maven.terraformersmc.com/releases'; content { includeGroup 'com.terraformersmc' } }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modCompileOnly("com.terraformersmc:modmenu:12.0.1") { transitive = false }
//	modImplementation ("curse.maven:reinforced-shulker-boxes-529874:7225066") { exclude group: "net.fabricmc.fabric-api" }
//	modImplementation "atonkish.reinfcore:reinforced-core:4.0.8+1.21.10"

	modImplementation include("me.fallenbreath:conditional-mixin-fabric:0.6.4")
	compileOnly group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand (
				"version": inputs.properties.version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url ='https://maven.moranpcy.com/releases'
			credentials(PasswordCredentials) {
				username = System.getenv("MAVEN_USERNAME")
				password = System.getenv("MAVEN_SECRET")
			}
		}
	}
}
