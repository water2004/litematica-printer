plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
    id 'maven-publish'
}

def prereleaseIdentifier = providers.gradleProperty("mod_prerelease")
        .orElse("").get().trim()
version = prereleaseIdentifier
        ? "${project.mod_version}-${prereleaseIdentifier}-${project.minecraft_version}"
        : "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "chainveinfabric" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven {url = "https://masa.dy.fi/maven/sakura-ryoko"
        content {includeGroupAndSubgroups("fi.dy.masa")}
    }
    maven {url = 'https://maven.fallenbreath.me/releases'
        content {includeGroupAndSubgroups("me.fallenbreath")}
    }
    maven { url = 'https://maven.terraformersmc.com/releases/'
        content {includeGroupAndSubgroups("com.terraformersmc")}
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "maven.modrinth:malilib:${project.malilib_version}"
    modCompileOnly "maven.modrinth:litematica:${project.litematica_version}"
    modCompileOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") { transitive = false }
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "chainveinfabric-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
        clearRunDirectory = false
    }
}

// 1.21.1 has server GameTests; the newer upstream client test API is unavailable.
sourceSets.gametest.java.setIncludes([
        "org/edtp/chainveinfabric/ChainVeinServerGameTests.java",
        "org/edtp/chainveinfabric/QuickShulkerServerGameTests.java",
        "org/edtp/chainveinfabric/gametest/mixin/QuickShulkerDirectCapabilityMixin.java"
])
sourceSets.gametest.resources.setSrcDirs(["src/gametest1211/resources"])

def quickShulkerJar = providers.gradleProperty("quickshulkerJar")
if (quickShulkerJar.isPresent()) {
    dependencies {
        modLocalRuntime files(quickShulkerJar.get())
        modLocalRuntime "me.fallenbreath:conditional-mixin-fabric:0.6.4"
    }
}
def quickShulkerTestMode = providers.gradleProperty("quickshulkerGameTestMode")
        .orElse(quickShulkerJar.isPresent() ? "new" : "none").get()
if (!(quickShulkerTestMode in ["none", "new", "new-legacy"])) {
    throw new GradleException("quickshulkerGameTestMode must be none, new, or new-legacy")
}
if (quickShulkerTestMode != "none" && !quickShulkerJar.isPresent()) {
    throw new GradleException("Quick Shulker integration tests require -PquickshulkerJar=/path/to/quickshulker.jar")
}
tasks.named("runGameTest") {
    jvmArgs "-Dchainveinfabric.gametest.quickshulker=${quickShulkerTestMode}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
    maven { url = 'https://api.modrinth.com/maven' }
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
