name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gametest:
    uses: ./.github/workflows/gametest.yml

  build:
    runs-on: ubuntu-latest
    needs: gametest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Verify release tag
        shell: bash
        run: |
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_SHA")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tags must point to a commit contained in main." >&2
            exit 1
          fi

          project_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          expected_tag="v${project_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version (expected $expected_tag)." >&2
            exit 1
          fi

          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle dependencies
        id: gradle-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
            ./libs
          key: ${{ runner.os }}-gradle-common
          restore-keys: |
            ${{ runner.os }}-gradle-common

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      # If `step: gradle-cache` fails to cache, start downloading dependencies to reduce build failures
      - name: Download dependencies
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        run: ./gradlew dependencies --stacktrace

      - name: Build version projects
        run: ./gradlew clean build --stacktrace

      - name: Capture version artifacts
        uses: actions/upload-artifact@v7
        with:
          name: litematica-printer-${{ github.ref_name }}
          path: versions/*/build/libs/litematica-printer-mc*.jar
          if-no-files-found: error

      - name: Collect mod jars
        shell: bash
        run: |
          mkdir mod-jars
          mapfile -t jars < <(find versions -type f -path '*/build/libs/litematica-printer-mc*.jar' | sort)
          if [[ "${#jars[@]}" -ne 2 ]]; then
            echo "Expected exactly 2 release jars, found ${#jars[@]}." >&2
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          for jar in "${jars[@]}"; do
              cp -p "$jar" mod-jars/
          done
          ls -l mod-jars

      - name: Remove previous jar assets
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag,
              });
              for (const asset of release.assets) {
                if (asset.name.endsWith('.jar')) {
                  await github.rest.repos.deleteReleaseAsset({
                    ...context.repo,
                    asset_id: asset.id,
                  });
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          name: Litematica Printer 4th ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: mod-jars/*.jar
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
