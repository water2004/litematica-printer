name: gametest

on:
  workflow_call:
  workflow_dispatch:

jobs:
  client-gametest:
    name: MC ${{ matrix.minecraft }} / ChainVein ${{ matrix.chainvein }} / QuickShulker ${{ matrix.quickshulker }} / loss ${{ matrix.packetloss }} / Servux protocol ${{ matrix.servux }} / bedrock ${{ matrix.bedrockminer || 'none' }} / Litematica ${{ matrix.litematica || 'default' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 26.1.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
          - minecraft: 26.1.2
            chainvein: true
            quickshulker: none
            packetloss: false
            servux: false
          - minecraft: 26.1.2
            chainvein: false
            quickshulker: direct
            packetloss: false
            servux: false
          - minecraft: 26.1.2
            chainvein: true
            quickshulker: direct
            packetloss: false
            servux: false
          - minecraft: 26.1.2
            chainvein: false
            quickshulker: legacy
            packetloss: false
            servux: false
          - minecraft: 26.1.2
            chainvein: true
            quickshulker: legacy
            packetloss: false
            servux: false
          - minecraft: 26.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
          - minecraft: 26.2
            chainvein: true
            quickshulker: none
            packetloss: false
            servux: false
          - minecraft: 26.2
            chainvein: false
            quickshulker: direct
            packetloss: false
            servux: false
          - minecraft: 26.2
            chainvein: true
            quickshulker: direct
            packetloss: false
            servux: false
          - minecraft: 26.2
            chainvein: false
            quickshulker: legacy
            packetloss: false
            servux: false
          - minecraft: 26.2
            chainvein: true
            quickshulker: legacy
            packetloss: false
            servux: false
          - minecraft: 26.2
            chainvein: false
            quickshulker: direct
            packetloss: true
            servux: false
          - minecraft: 26.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: true
          - minecraft: 26.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
            bedrockminer: bedrockminer
          - minecraft: 26.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
            bedrockminer: blockminer
          - minecraft: 26.1.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
            litematica: '0.27.9'
            malilib: '0.28.8'
          - minecraft: 26.1.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
            litematica: '0.27.10'
            malilib: '0.28.8'
          - minecraft: 26.1.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
            litematica: '0.27.11'
            malilib: '0.28.10'
          - minecraft: 26.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
            litematica: '0.28.3'
            malilib: '0.29.2'
          - minecraft: 26.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
            litematica: '0.28.4'
            malilib: '0.29.2'
          - minecraft: 26.2
            chainvein: false
            quickshulker: none
            packetloss: false
            servux: false
            litematica: '0.28.5'
            malilib: '0.29.4'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run client GameTest
        run: >-
          xvfb-run -a ./gradlew
          ":${{ matrix.minecraft }}:runClientGameTest"
          -PprinterGameTest=true
          -PprinterGameTestChainVein=${{ matrix.chainvein }}
          -PprinterGameTestQuickShulker=${{ matrix.quickshulker }}
          -PprinterGameTestQuickShulkerPacketLoss=${{ matrix.packetloss }}
          -PprinterGameTestServux=${{ matrix.servux }}
          -PprinterGameTestBedrockMiner=${{ matrix.bedrockminer || 'none' }}
          -PprinterGameTestLitematica=${{ matrix.litematica || 'default' }}
          -PprinterGameTestMalilib=${{ matrix.malilib || 'default' }}
          --no-daemon
          --stacktrace

      - name: Upload GameTest diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-${{ matrix.minecraft }}-chain-${{ matrix.chainvein }}-quick-${{ matrix.quickshulker }}-loss-${{ matrix.packetloss }}-servux-${{ matrix.servux }}-bedrock-${{ matrix.bedrockminer || 'none' }}-litematica-${{ matrix.litematica || 'default' }}
          path: |
            versions/${{ matrix.minecraft }}/build/run/clientGameTest/logs/**
            versions/${{ matrix.minecraft }}/build/run/clientGameTest/crash-reports/**
          if-no-files-found: warn
