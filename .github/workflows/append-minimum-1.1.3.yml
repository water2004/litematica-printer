name: Append verified minimum MC 1.21 files
on:
  push:
    branches: ['dory/minimum-1.21.11-release-1.1.3']
    paths: ['.github/republish-1.1.3/publish-config.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned CI and all 36 complete class/resource identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/republish-1.1.3/publish-collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: minimum-all-12-verified-${{ github.sha }}
          path: .ci/minimum-release-files/
          if-no-files-found: error
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: minimum-all-12-verified-${{ github.sha }}
          path: minimum-release-files
      - name: Append only Printer 1.1.3 JARs and dependency table
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/republish-1.1.3/publish-append.py
      - name: Retain preservation and public download verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-printer-publication-${{ github.sha }}
          path: .ci/release-publication/
          if-no-files-found: warn
