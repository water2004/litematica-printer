name: Verify minimum MC 1.21.11 candidate
on:
  push:
    branches: ['dory/minimum-1.21.11-release-1.1.3']
    paths-ignore: ['.github/republish-1.1.3/publish-*', '.github/workflows/append-minimum-1.1.3.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-minimum-12111-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      SDL_VIDEODRIVER: x11
      SDL_VIDEO_DRIVER: x11
      SDL_VIDEO_FORCE_EGL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify original eleven production sources are unchanged
        run: python .github/scripts/verify-original-eleven.py
      - name: Install client graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-vulkan-drivers libflite1
      - name: Compile, compare exact production classes and run minimum compatibility tests
        run: |
          chmod +x gradlew
          python .github/scripts/candidate12111.py
      - name: Retain candidate files and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-1.21.11-candidate-${{ github.sha }}
          path: |
            .ci/republish-1.1.3/
            .ci/results/1.21.11/
            .ci/source-1.21.11/*/build/test-results/
            .ci/source-1.21.11/*/build/run/
            core/build/test-results/
          include-hidden-files: true
          if-no-files-found: error
