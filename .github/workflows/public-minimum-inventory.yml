name: Verify all twelve public minimum versions
on:
  push:
    branches: ['dory/minimum-1.21.11-release-1.1.3']
    paths: ['.github/republish-1.1.3/publish-inventory.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check all 36 public digests, four complete tables and preserved author assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/republish-1.1.3/publish-check-inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-minimum-inventory-${{ github.sha }}
          path: .ci/public-inventory/
          if-no-files-found: error
