plugins {
    id 'mod-plugin'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom'
}

version = modConfig.fullProjectVersion
group = modConfig.modMavenGroup

base {
    archivesName.set("${modConfig.modArchivesBaseName}-mc${modConfig.mcVersion}")
}

def printerGameTest = providers.gradleProperty('printerGameTest')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestChainVein = providers.gradleProperty('printerGameTestChainVein')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestQuickShulker = providers.gradleProperty('printerGameTestQuickShulker')
        .orElse(printerGameTest ? 'none' : 'current')
        .get()
def gameTestNetworkFaults = providers.gradleProperty('printerGameTestNetworkFaults')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestQuickShulkerPacketLoss = providers.gradleProperty(
        'printerGameTestQuickShulkerPacketLoss')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestQuickShulkerLegacyPacketLoss = providers.gradleProperty(
        'printerGameTestQuickShulkerLegacyPacketLoss')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestQuickShulkerStress = providers.gradleProperty(
        'printerGameTestQuickShulkerStress')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestScanPerformance = providers.gradleProperty(
        'printerGameTestScanPerformance')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestScanProfileLabel = providers.gradleProperty(
        'printerGameTestScanProfileLabel')
        .orElse('unspecified')
        .get()
def gameTestScanJfr = providers.gradleProperty('printerGameTestScanJfr')
        .orElse('')
        .get()
def gameTestScanIterations = providers.gradleProperty(
        'printerGameTestScanIterations')
        .orElse('1')
        .get()
def gameTestScanBenchmarkOnly = providers.gradleProperty(
        'printerGameTestScanBenchmarkOnly')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestQuickShulkerStressLossPercent = providers.gradleProperty(
        'printerGameTestQuickShulkerStressLossPercent')
        .orElse('15')
        .get()
def gameTestQuickShulkerIntegrationOnly = providers.gradleProperty(
        'printerGameTestQuickShulkerIntegrationOnly')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestServux = providers.gradleProperty('printerGameTestServux')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def gameTestBedrockMiner = providers.gradleProperty('printerGameTestBedrockMiner')
        .orElse('none')
        .get()
def gameTestLitematica = providers.gradleProperty('printerGameTestLitematica')
        .orElse('default')
        .get()
def gameTestMalilib = providers.gradleProperty('printerGameTestMalilib')
        .orElse('default')
        .get()
def gameTestLitematicaOverride = gameTestLitematica != 'default'

if (!(gameTestQuickShulker in ['none', 'current', 'legacy', 'direct', 'direct-fallback'])) {
    throw new GradleException(
            "printerGameTestQuickShulker 必须是 none、current、legacy、direct 或 direct-fallback，当前为 ${gameTestQuickShulker}")
}
if (!(gameTestBedrockMiner in ['none', 'bedrockminer', 'blockminer'])) {
    throw new GradleException(
            "printerGameTestBedrockMiner 必须是 none、bedrockminer 或 blockminer，当前为 ${gameTestBedrockMiner}")
}
if (gameTestLitematicaOverride != (gameTestMalilib != 'default')) {
    throw new GradleException(
            'printerGameTestLitematica 和 printerGameTestMalilib 必须同时指定')
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'litematica-printer-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
        username = 'PrinterGameTest'
    }
}

repositories {
    mavenCentral()
    maven { name = 'FabricMC'; url = 'https://maven.fabricmc.net' }
    // MaLiLib/Litematica 26.1.2 的传递依赖 conditional-mixin-fabric 位于此仓库。
    maven { name = 'FallenBreath'; url = 'https://maven.fallenbreath.me/releases' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases' }
    maven { name = 'Masa'; url = 'https://masa.dy.fi/maven' }
    maven { name = 'SakuraRyoko'; url = 'https://masa.dy.fi/maven/sakura-ryoko' }
}

configurations.configureEach {
    resolutionStrategy {
        force "net.fabricmc:fabric-loader:${modConfig.fabricLoaderVersion}"
        force "com.terraformersmc:modmenu:${modConfig.prop('modmenu')}"
        force "maven.modrinth:malilib:${gameTestLitematicaOverride
                ? gameTestMalilib : modConfig.prop('malilib_dependency')}"
        force "maven.modrinth:litematica:${gameTestLitematicaOverride
                ? gameTestLitematica : modConfig.prop('litematica_dependency')}"
    }
}

dependencies {
    implementation project(':core')
    minecraft "com.mojang:minecraft:${modConfig.mcVersion}"
    implementation "net.fabricmc:fabric-loader:${modConfig.fabricLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${modConfig.fabricApiVersion}"

    def pinyinDependency = implementation("com.belerweb:pinyin4j:${modConfig.prop('pinyin_version')}")
    include pinyinDependency

    implementation "com.terraformersmc:modmenu:${modConfig.prop('modmenu')}"
    def chainVeinFile = modConfig.downloadDependencyMod(modConfig.prop('chainvein').toString())
    if (chainVeinFile == null || !chainVeinFile.exists()) {
        throw new GradleException("无法下载 ChainVeinFabric 编译依赖")
    }
    compileOnly files(chainVeinFile)
    if (printerGameTest && gameTestChainVein) {
        def gameTestChainVeinJar = project.findProperty('printerGameTestChainVeinJar')?.toString()
        if (gameTestChainVeinJar == null || gameTestChainVeinJar.isEmpty()) {
            def gameTestChainVeinFile = modConfig.downloadDependencyMod(
                    modConfig.prop('chainvein_gametest').toString())
            if (gameTestChainVeinFile == null || !gameTestChainVeinFile.exists()) {
                throw new GradleException("无法下载 ChainVeinFabric GameTest 依赖")
            }
            gametestImplementation files(gameTestChainVeinFile)
        } else if (file(gameTestChainVeinJar).exists()) {
            gametestImplementation files(gameTestChainVeinJar)
        } else {
            throw new GradleException(
                    "printerGameTestChainVeinJar 不存在：${gameTestChainVeinJar}")
        }
    }

    if (printerGameTest && gameTestLitematicaOverride) {
        implementation "maven.modrinth:malilib:${gameTestMalilib}"
        implementation "maven.modrinth:litematica:${gameTestLitematica}"
    } else {
        implementation "fi.dy.masa.malilib:${modConfig.prop('malilib')}"
        implementation "fi.dy.masa.litematica:${modConfig.prop('litematica')}"
    }
    def quickshulkerUrl = modConfig.prop('quickshulker').toString()
    if (!quickshulkerUrl.isEmpty()) {
        def quickshulkerFile = modConfig.downloadDependencyMod(quickshulkerUrl)
        if (quickshulkerFile != null && quickshulkerFile.exists()) {
            if (!printerGameTest) {
                implementation files(quickshulkerFile)
            } else if (gameTestQuickShulker in ['current', 'direct', 'direct-fallback']) {
                gametestImplementation files(quickshulkerFile)
            }
        }
    }
    if (printerGameTest && gameTestQuickShulker == 'legacy') {
        def legacyQuickShulkerUrl = project.findProperty('quickshulker_legacy')?.toString()
        if (legacyQuickShulkerUrl == null || legacyQuickShulkerUrl.isEmpty()) {
            throw new GradleException('未配置 quickshulker_legacy 测试依赖')
        }
        def legacyQuickShulkerFile = modConfig.downloadDependencyMod(legacyQuickShulkerUrl)
        if (legacyQuickShulkerFile == null || !legacyQuickShulkerFile.exists()) {
            throw new GradleException('无法下载 QuickShulker 3.0.4 测试依赖')
        }
        gametestImplementation files(legacyQuickShulkerFile)
    }

    def networkChaosUrl = project.findProperty('network_chaos')?.toString()
    if (networkChaosUrl != null && !networkChaosUrl.isEmpty()) {
        def networkChaosFile = modConfig.downloadDependencyMod(networkChaosUrl)
        if (networkChaosFile == null || !networkChaosFile.exists()) {
            throw new GradleException('无法下载 NetworkChaosFabric GameTest 依赖')
        }
        gametestImplementation files(networkChaosFile)
    }

    if (printerGameTest && gameTestBedrockMiner != 'none') {
        def propertyName = gameTestBedrockMiner == 'bedrockminer'
                ? 'bedrock_miner_gametest'
                : 'block_miner_gametest'
        def minerUrl = project.findProperty(propertyName)?.toString()
        if (minerUrl == null || minerUrl.isEmpty()) {
            throw new GradleException("未配置 ${gameTestBedrockMiner} GameTest 发布依赖")
        }
        def minerFile = modConfig.downloadDependencyMod(minerUrl)
        if (minerFile == null || !minerFile.exists()) {
            throw new GradleException("无法下载 ${gameTestBedrockMiner} GameTest 依赖")
        }
        gametestImplementation files(minerFile)
    }
}

tasks.named('jar', Jar) {
    dependsOn project(':core').tasks.named('classes')
    from(project(':core').sourceSets.main.output)
}

loom {
    def commonVmArgs = [
            '-Dmixin.debug.export=true',
            '-Dmixin.debug.verbose=true',
            '-Dmixin.env.remapRefMap=true'
    ]
    def clientProgramArgs = [
            '--width', '1280',
            '--height', '720',
            '--username', 'PrinterTest'
    ]
    runs {
        named('client') {
            generateRunConfig.set(true)
            jvmArguments.set(commonVmArgs)
            programArguments.set(clientProgramArgs)
            runDirectory.dir('../../run/client')
        }
    }
}

tasks.named('runClientGameTest') {
    jvmArgs '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    jvmArgs "-Dlitematica-printer.gametest.chainvein=${gameTestChainVein}"
    jvmArgs "-Dlitematica-printer.gametest.quickshulker=${gameTestQuickShulker}"
    jvmArgs "-Dlitematica-printer.gametest.quickshulkerPacketLoss=${gameTestQuickShulkerPacketLoss}"
    jvmArgs "-Dlitematica-printer.gametest.quickshulkerLegacyPacketLoss=${gameTestQuickShulkerLegacyPacketLoss}"
    jvmArgs "-Dlitematica-printer.gametest.quickshulkerStress=${gameTestQuickShulkerStress}"
    jvmArgs "-Dlitematica-printer.gametest.scanPerformance=${gameTestScanPerformance}"
    jvmArgs "-Dlitematica-printer.gametest.scanProfileLabel=${gameTestScanProfileLabel}"
    jvmArgs "-Dlitematica-printer.gametest.scanIterations=${gameTestScanIterations}"
    jvmArgs "-Dlitematica-printer.gametest.scanBenchmarkOnly=${gameTestScanBenchmarkOnly}"
    if (!gameTestScanJfr.isEmpty()) {
        jvmArgs "-XX:StartFlightRecording=filename=${gameTestScanJfr},settings=profile,dumponexit=true"
    }
    jvmArgs "-Dlitematica-printer.gametest.quickshulkerStressLossPercent=${gameTestQuickShulkerStressLossPercent}"
    jvmArgs "-Dlitematica-printer.gametest.quickshulkerIntegrationOnly=${gameTestQuickShulkerIntegrationOnly}"
    jvmArgs "-Dlitematica-printer.gametest.networkFaults=${gameTestNetworkFaults}"
    jvmArgs "-Dlitematica-printer.gametest.servux=${gameTestServux}"
    jvmArgs "-Dlitematica-printer.gametest.bedrockMiner=${gameTestBedrockMiner}"
    jvmArgs "-Dlitematica-printer.gametest.litematica=${gameTestLitematica}"
    jvmArgs "-Dlitematica-printer.gametest.malilib=${gameTestMalilib}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = modConfig.modId
            version = modConfig.fullProjectVersion
        }
    }
    repositories {
        mavenLocal()
        maven {
            url = uri("${rootDir}/publish")
        }
    }
}
